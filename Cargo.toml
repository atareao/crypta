[package]
name = "crypta"
version = "0.2.1"
edition = "2021"
description = "Gestor de secretos moderno escrito en Rust puro, compatible con SOPS/Age para encriptación de secretos y sincronización automática con Git."
license = "MIT"
repository = "https://github.com/atareao/crypta"
homepage = "https://github.com/atareao/crypta"
keywords = ["secrets", "sops", "age", "encryption", "git"]
categories = ["command-line-utilities", "cryptography"]
readme = "README.md"

[lib]
name = "crypta"
path = "src/lib.rs"

[[bin]]
name = "crypta"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
git2 = "0.21"
arboard = "3.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
rand = "0.10"

[dev-dependencies]
tempfile = "3.27"
